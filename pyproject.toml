[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrv-recorder"
version = "0.1.0"
description = "Local Polar H7 RR interval recorder and HRV analysis tool"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bleak",
  "bleakheart",
  "PySide6",
  "pyqtgraph",
  "numpy",
  "pandas",
  "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
hrv-recorder = "hrv_recorder.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
